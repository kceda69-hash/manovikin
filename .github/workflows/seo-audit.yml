name: SEO audit

# Runs the static SEO audit on every push and PR. Fails the build if a route
# is missing from the sitemap, contradicts robots.txt, or has a stale
# canonical / og:url — catching deploy-time SEO regressions early.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    # `checks: write` lets workflow-command annotations attach to PR files
    # so each failing finding shows as an inline warning/error in the diff.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run SEO audit
        run: bun run seo:audit
      - name: Sitemap ↔ robots.txt consistency check
        # Bidirectional check: every sitemap URL is crawlable per robots.txt,
        # every Disallow rule fails to match every sitemap URL. Uses the real
        # builder in src/lib/sitemap.ts against src/routes/, so drift in
        # either file fails the build.
        run: bunx vitest run src/lib/__tests__/sitemap-robots.test.ts
      - name: Verify SEO autofix has nothing to do
        # If autofix in --check mode would rewrite canonicals, prune the
        # sitemap, or add Disallow rules, fail the build. Contributors run
        # `bun run seo:autofix` locally and commit the deterministic result.
        run: bun run seo:autofix:check
      - name: Verify SEO snapshot is up to date
        # Regenerate .seo-snapshots/ and fail if the committed snapshot
        # doesn't match — forces intentional review of robots.txt +
        # sitemap.xml changes rather than silent drift.
        run: |
          bun run seo:snapshot
          if ! git diff --quiet -- .seo-snapshots; then
            echo "::error title=SEO snapshot out of date::.seo-snapshots/ is stale. Run 'bun run seo:snapshot' locally and commit the result."
            git --no-pager diff -- .seo-snapshots
            exit 1
          fi


